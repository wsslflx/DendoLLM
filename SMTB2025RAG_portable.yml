name: DendoLLM
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy
  - scipy
  - requests
  - python-dotenv
  - pydantic
  - PyPDF2
  - pypdf
  - tesseract
  - poppler
  - pip:
      - openai
      - tiktoken
      - chromadb
      - langchain
      - langchain-core
      - langchain-openai
      - langchain-community
      - langchain-text-splitters
      - langchain-chroma
      - unstructured
      - unstructured-inference
      - unstructured-pytesseract
      - pdf2image
      - pycryptodome
